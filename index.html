<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sarah M. Smart — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#A5311F; --dark:#7E2415; --cream:#FBF3E4; --panel:#FFF9EC;
    --gold:#E8B54B; --tan:#B98E3F; --brown:#33241D; --muted:#5C4B3A;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--brand); color:var(--cream);
    font-family:'Source Serif 4',Georgia,serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px; -webkit-font-smoothing:antialiased;
  }
  .card{width:100%; max-width:420px; text-align:center}

  h1{
    margin:0 0 6px; font-family:Poppins,sans-serif; font-weight:700;
    font-size:clamp(24px,6vw,34px); letter-spacing:7px; line-height:1.15;
  }
  .m{position:relative; display:inline-block}
  .m svg{
    position:absolute; left:50%; top:-.19em; transform:translateX(-50%) scaleY(-1);
    width:.85em; height:.92em; pointer-events:none;
  }
  .kicker{
    font-family:Poppins,sans-serif; font-weight:600; font-size:11px;
    letter-spacing:4px; color:var(--gold); margin-bottom:26px;
  }
  .lede{font-style:italic; font-size:16px; margin:0 0 22px; color:#F0CFA6}

  form{display:flex; flex-direction:column; gap:10px}
  input{
    font:inherit; font-size:16px; padding:13px 15px; border-radius:10px;
    border:1.5px solid var(--tan); background:var(--panel); color:var(--brown);
    width:100%;
  }
  input:focus{outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold)}
  button{
    font-family:Poppins,sans-serif; font-weight:600; font-size:15px;
    padding:13px 18px; border-radius:100px; border:0; cursor:pointer;
    background:var(--gold); color:var(--dark);
  }
  button:hover:not(:disabled){background:#F2C14E}
  button:disabled{opacity:.6; cursor:default}

  .msg{min-height:20px; font-size:14px; margin-top:12px; color:#F0CFA6}
  .msg.err{color:#FFD9CF}

  .bar{
    height:4px; border-radius:4px; background:rgba(251,243,228,.22);
    overflow:hidden; margin-top:14px; display:none;
  }
  .bar.on{display:block}
  .bar i{display:block; height:100%; width:0; background:var(--gold); transition:width .15s}

  .foot{margin-top:26px; font-size:13px; color:#F0CFA6}
  .foot a{color:var(--cream)}
</style>
</head>
<body>

<main class="card">
  <h1>SARAH <span class="m">M<svg viewBox="0 0 26 26" aria-hidden="true"><path d="M13 0.5 L23.5 19.5 Q13 25 2.5 19.5 Z" fill="#F2C14E"></path><path d="M2.5 19.5 Q13 25 23.5 19.5 L22.1 17 Q13 21.8 3.9 17 Z" fill="#7E2415"></path><circle cx="13" cy="10" r="2.1" fill="#A5311F"></circle><circle cx="9.8" cy="15" r="1.9" fill="#A5311F"></circle><circle cx="16.2" cy="15.2" r="1.9" fill="#A5311F"></circle></svg></span>. SMART</h1>
  <div class="kicker">WORD PERSON · PORTFOLIO</div>
  <p class="lede">This portfolio is password-protected.</p>

  <form id="f">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password"
           autofocus aria-label="Password">
    <button id="go" type="submit">Unlock</button>
  </form>

  <div class="bar" id="bar"><i id="fill"></i></div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>

  <div class="foot">Looking for the deck? <a href="/deck">View it here</a>.</div>
</main>

<script>
(function () {
  'use strict';
  var ITER = 200000, FILE = 'site.enc';
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), msg = document.getElementById('msg'),
      bar = document.getElementById('bar'), fill = document.getElementById('fill');

  var cached = null;   // the encrypted blob, fetched once

  function say(t, err) { msg.textContent = t; msg.className = err ? 'msg err' : 'msg'; }

  // Fetch with progress — the payload is a few MB, so a silent wait feels broken.
  function load() {
    if (cached) return Promise.resolve(cached);
    bar.className = 'bar on';
    return fetch(FILE).then(function (r) {
      if (!r.ok) throw new Error('fetch ' + r.status);
      var total = +r.headers.get('content-length') || 0, got = 0, chunks = [];
      var reader = r.body && r.body.getReader ? r.body.getReader() : null;
      if (!reader) return r.arrayBuffer();
      return (function pump() {
        return reader.read().then(function (res) {
          if (res.done) {
            var out = new Uint8Array(got), at = 0;
            chunks.forEach(function (c) { out.set(c, at); at += c.length; });
            return out.buffer;
          }
          chunks.push(res.value); got += res.value.length;
          if (total) fill.style.width = Math.round(got / total * 100) + '%';
          return pump();
        });
      })();
    }).then(function (buf) { cached = buf; return buf; });
  }

  function unlock(password, buf) {
    var b = new Uint8Array(buf);
    var salt = b.slice(0, 16), iv = b.slice(16, 28), body = b.slice(28);
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, body);
      })
      .then(function (plain) { return new TextDecoder().decode(plain); });
  }

  function show(html) {
    // Replace this page with the decrypted site. document.write keeps the real
    // URL (and its #hash), which the site's hash routing depends on.
    document.open();
    document.write(html);
    document.close();
  }

  function attempt(password, quiet) {
    go.disabled = true;
    say(quiet ? 'Unlocking…' : 'Unlocking…');
    return load()
      .then(function (buf) { return unlock(password, buf); })
      .then(function (html) {
        try { sessionStorage.setItem('sms_pw', password); } catch (e) {}
        show(html);
      })
      .catch(function (e) {
        bar.className = 'bar';
        go.disabled = false;
        if (e && /fetch/.test(e.message)) say('Could not load the portfolio. Try refreshing.', true);
        else { say('That password didn’t work.', true); pw.value = ''; pw.focus(); }
        try { sessionStorage.removeItem('sms_pw'); } catch (e2) {}
      });
  }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = pw.value;
    if (!v) { say('Enter the password.', true); pw.focus(); return; }
    attempt(v, false);
  });

  // Already unlocked this session? Go straight in (survives refresh).
  var saved = null;
  try { saved = sessionStorage.getItem('sms_pw'); } catch (e) {}
  if (saved) attempt(saved, true);
})();
</script>
</body>
</html>
